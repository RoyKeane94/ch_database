{% extends "core/base.html" %}

{% block title %}Holidays — COFAX{% endblock %}

{% block content %}
    <h1 class="page-title">Malaga · 7 nights · £150</h1>
    <p class="page-sub">This page is not included in your holiday.</p>

    <div class="panel" style="max-width:560px">
        <div class="panel-body">
            <p class="hint">Flights not included. Transfer not included. Hotel may not exist.</p>
            <p class="detail-item" style="margin-top:16px">
                <span class="detail-key">Terms</span>
                <span class="detail-val"><a href="{% url 'core:company_list' %}">Return to the register</a></span>
            </p>
            <p class="detail-item" style="margin-bottom:0">
                <span class="detail-key">Offer ends</span>
                <span class="detail-val">1989</span>
            </p>
        </div>
    </div>
{% endblock %}
