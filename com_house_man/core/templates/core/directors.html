{% extends "core/base.html" %}

{% block title %}Directors — COFAX{% endblock %}

{% block content %}
    <h1 class="page-title">Directors</h1>
    <p class="page-sub">Officer data is not yet available on COFAX.</p>

    <div class="panel" style="max-width:560px">
        <div class="panel-body">
            <p class="detail-item">
                <span class="detail-key">PSC register</span>
                <span class="detail-val">Available per company after API sync</span>
            </p>
            <p class="detail-item" style="margin-bottom:0">
                <span class="detail-key">Next step</span>
                <span class="detail-val">Select a company from <a href="{% url 'core:company_list' %}">search</a> to view PSC records</span>
            </p>
            <div class="btn-row">
                <a class="btn btn-primary" href="{% url 'core:company_list' %}">Go to search</a>
            </div>
        </div>
    </div>
{% endblock %}
