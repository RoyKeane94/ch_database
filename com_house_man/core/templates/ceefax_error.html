{% load static %}
<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} — COFAX</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
    <div class="error-page">
        <header class="topbar">
            <a class="logo" href="{{ home_url }}">
                <svg class="logo-mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="2" y="6" width="12" height="12" rx="6" fill="#0d0d0f"/>
                    <rect x="10" y="6" width="12" height="12" rx="6" fill="#0d0d0f" opacity="0.45"/>
                </svg>
                cofax
            </a>
            <span class="topbar-meta">Error {{ error_code }}</span>
        </header>

        <main class="error-main">
            <p class="error-code">Error {{ error_code }}</p>
            <h1 class="error-title">{{ headline }}</h1>
            <div class="error-lines">
                {% for line in lines %}
                    <p>{{ line }}</p>
                {% endfor %}
                {% if path %}
                    <p style="margin-top:12px;font-size:13px;color:var(--faint)">Request: {{ path }}</p>
                {% endif %}
            </div>
            <div class="error-actions">
                <a class="btn btn-primary" href="{{ home_url }}">Back home</a>
                <a class="btn btn-secondary" href="{{ search_url }}">Search register</a>
                <a class="btn btn-ghost" href="{{ help_url }}">Help</a>
            </div>
        </main>
    </div>
</body>
</html>
